# Gruvbox dark for Yazi — mirrors kitty/.config/kitty/gruvbox-dark.conf.
# Picked automatically from the terminal background via [flavor] in theme.toml.

# : Manager {{{

[mgr]
cwd = { fg = "#8ec07c" }

# Find
find_keyword  = { fg = "#fabd2f", bold = true, italic = true, underline = true }
find_position = { fg = "#d3869b", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { fg = "#928374", italic = true }

# Marker
marker_copied   = { fg = "#b8bb26",  bg = "#b8bb26" }
marker_cut      = { fg = "#fb4934",    bg = "#fb4934" }
marker_marked   = { fg = "#8ec07c",   bg = "#8ec07c" }
marker_selected = { fg = "#fabd2f", bg = "#fabd2f" }

# Count
count_copied   = { fg = "#282828", bg = "#b8bb26" }
count_cut      = { fg = "#282828", bg = "#fb4934" }
count_selected = { fg = "#282828", bg = "#fabd2f" }

# Border
border_symbol = "│"
border_style  = { fg = "#665c54" }

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#fbf1c7", bg = "#d65d0e", bold = true }
inactive = { fg = "#ebdbb2", bg = "#3c3836" }

# : }}}


# : Mode {{{

[mode]
normal_main = { fg = "#282828", bg = "#83a598", bold = true }
normal_alt  = { fg = "#83a598", bg = "#3c3836" }

select_main = { fg = "#282828", bg = "#fe8019", bold = true }
select_alt  = { fg = "#fe8019", bg = "#3c3836" }

unset_main = { fg = "#282828", bg = "#fb4934", bold = true }
unset_alt  = { fg = "#fb4934", bg = "#3c3836" }

# : }}}


# : Indicator of hovered file {{{

[indicator]
parent  = { fg = "#ebdbb2", bg = "#504945" }
current = { fg = "#fbf1c7", bg = "#d65d0e" }
preview = { underline = true }

# : }}}


# : Status bar {{{

[status]
perm_sep   = { fg = "#928374" }
perm_type  = { fg = "#b8bb26" }
perm_read  = { fg = "#fabd2f" }
perm_write = { fg = "#fb4934" }
perm_exec  = { fg = "#8ec07c" }

progress_label  = { fg = "#ebdbb2", bold = true }
progress_normal = { fg = "#b8bb26", bg = "#3c3836" }
progress_error  = { fg = "#fb4934", bg = "#3c3836" }

# : }}}


# : Which {{{

[which]
border          = { fg = "#665c54" }
mask            = { bg = "#3c3836" }
cand            = { fg = "#8ec07c" }
rest            = { fg = "#928374" }
desc            = { fg = "#d3869b" }
separator_style = { fg = "#928374" }

# : }}}


# : Popups {{{

[confirm]
border = { fg = "#83a598" }
title  = { fg = "#83a598" }

[spot]
border   = { fg = "#83a598" }
title    = { fg = "#83a598" }
tbl_col  = { fg = "#83a598" }
tbl_cell = { fg = "#fabd2f", reversed = true }

[notify]
title_info  = { fg = "#b8bb26" }
title_warn  = { fg = "#fabd2f" }
title_error = { fg = "#fb4934" }

[pick]
border = { fg = "#83a598" }
active = { fg = "#d3869b", bold = true }

[input]
border = { fg = "#83a598" }

[cmp]
border = { fg = "#83a598" }

[tasks]
border  = { fg = "#83a598" }
hovered = { fg = "#d3869b", bold = true }

[help]
border  = { fg = "#83a598" }
chord   = { fg = "#8ec07c" }
hovered = { fg = "#fbf1c7", bg = "#d65d0e", bold = true }

# : }}}


# : File-specific styles {{{

[filetype]
rules = [
	{ mime = "**/image/*", fg = "#fabd2f" },
	{ mime = "**/{audio,video}/*", fg = "#d3869b" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#fb4934" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#8ec07c" },
	{ mime = "vfs/{absent,stale}", fg = "#928374" },
	{ url = "*", is = "orphan", bg = "#fb4934" },
	{ url = "*", is = "exec", fg = "#b8bb26" },
	{ url = "*", is = "dummy", bg = "#fb4934" },
	{ url = "*/", is = "dummy", bg = "#fb4934" },
	{ url = "*/", fg = "#83a598", bold = true },
]

# : }}}
