# Font — Atkinson Hyperlegible Mono, made for low vision: wide letters, tall
# lowercase, 0/O and 1/l/I clearly apart. It is a variable font whose default
# instance is ExtraLight, so the weights are named. Nerd Font icons come from kitty's bundled symbols font.
# Medium instead of Regular: the display runs at a scaled "More Space" resolution,
# whose downsampling thins and blurs strokes; the heavier weight keeps them solid.
font_family      family="Atkinson Hyperlegible Mono" style=Medium
bold_font        family="Atkinson Hyperlegible Mono" style=Bold
italic_font      family="Atkinson Hyperlegible Mono" style=Italic
bold_italic_font family="Atkinson Hyperlegible Mono" style="Bold Italic"
font_size        14.0
modify_font      cell_height 105%
disable_ligatures cursor

# Window — no macOS title bar, some breathing room around the text
hide_window_decorations titlebar-only
window_padding_width    6 10
remember_window_size    yes
initial_window_width    160c
initial_window_height   45c
confirm_os_window_close 0

# Multiplexing (panes, windows, sessions, Ctrl+hjkl) belongs to tmux, so kitty
# stays a single plain window: its own tab and window shortcuts do nothing.
map cmd+t           no_op
map cmd+enter       no_op
map kitty_mod+t     no_op
map kitty_mod+enter no_op

# Remote control over a socket only, so `theme` can recolour running windows (needs a full restart)
allow_remote_control socket-only
listen_on            unix:/tmp/kitty

# macOS
# Left Option is Alt (zsh word jumps); right Option stays macOS Option for
# accents, which the keyboard firmware sends as right Option + e, u, ...
macos_option_as_alt                left
macos_quit_when_last_window_closed yes
macos_show_window_title_in         none

# Cursor / mouse / misc
cursor_shape          block
cursor_blink_interval 0
mouse_hide_wait       2.0
copy_on_select        yes

# Cmd+click opens URLs (plain click works too), even when a program grabs the mouse
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link
mouse_map cmd+left press   grabbed           discard_event
scrollback_lines      10000
enable_audio_bell     no
visual_bell_duration  0

# Theme — Gruvbox, matching nvim / starship / btop.
# current-theme.conf is a per-machine symlink to gruvbox-dark.conf or
# gruvbox-light.conf, managed by `theme dark|light` (not tracked in git).
include current-theme.conf
