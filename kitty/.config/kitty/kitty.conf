# Font — Nerd Font so starship / nvim icons render
font_family      Iosevka Nerd Font
font_size        13.0
# Iosevka is narrow and tight; a little extra line height helps readability
modify_font      cell_height 105%
disable_ligatures cursor

# Window — no macOS title bar, some breathing room around the text
hide_window_decorations titlebar-only
window_padding_width    6 10
remember_window_size    yes
initial_window_width    160c
initial_window_height   45c
confirm_os_window_close 0

# Tab bar — only shown once there are 2+ tabs (⌘T)
tab_bar_edge      bottom
tab_bar_style     powerline
tab_powerline_style slanted

# Splits (panes) — ⌘D right, ⇧⌘D down, ⌘Enter zooms; new splits/tabs keep the cwd
enabled_layouts splits,stack
map cmd+d       launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+t       new_tab_with_cwd
map cmd+enter   toggle_layout stack
# ⌘W closes the pane (and the tab with its last pane); ⌘1–9 jump to tabs, not panes
map cmd+w close_window
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Ctrl+hjkl moves between splits; inside nvim, vim-kitty-navigator takes over
# (it sets IS_VIM and hands off to kitty at the edge of its own splits)
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
map --when-focus-on var:IS_VIM=true ctrl+h
map --when-focus-on var:IS_VIM=true ctrl+j
map --when-focus-on var:IS_VIM=true ctrl+k
map --when-focus-on var:IS_VIM=true ctrl+l

# Remote control over a socket only, so nvim can focus kitty splits (needs a full restart)
allow_remote_control socket-only
listen_on            unix:/tmp/kitty

# macOS
# Left Option is Alt (zsh word jumps); right Option stays macOS Option for
# accents, which the keyboard firmware sends as right Option + e, u, ...
macos_option_as_alt                left
macos_quit_when_last_window_closed yes
macos_show_window_title_in         none

# Cursor / mouse / misc
cursor_shape          block
cursor_blink_interval 0
mouse_hide_wait       2.0
copy_on_select        yes

# Cmd+click opens URLs (plain click works too), even when a program grabs the mouse
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link
mouse_map cmd+left press   grabbed           discard_event
scrollback_lines      10000
enable_audio_bell     no
visual_bell_duration  0

# Theme — Gruvbox, matching nvim / starship / btop.
# current-theme.conf is a per-machine symlink to gruvbox-dark.conf or
# gruvbox-light.conf, managed by `theme dark|light` (not tracked in git).
include current-theme.conf
