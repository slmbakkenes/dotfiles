# Font — Nerd Font so starship / nvim icons render
font_family      Iosevka Nerd Font
font_size        13.0
# Iosevka is narrow and tight; a little extra line height helps readability
modify_font      cell_height 105%
disable_ligatures cursor

# Window — no macOS title bar, some breathing room around the text
hide_window_decorations titlebar-only
window_padding_width    6 10
remember_window_size    yes
initial_window_width    160c
initial_window_height   45c
confirm_os_window_close 0

# tmux handles tabs and splits, so keep kitty's own tab bar out of the way
tab_bar_style hidden

# macOS
macos_option_as_alt                yes
macos_quit_when_last_window_closed yes
macos_show_window_title_in         none

# Cursor / mouse / misc
cursor_shape          block
cursor_blink_interval 0
mouse_hide_wait       2.0
copy_on_select        yes
scrollback_lines      10000
enable_audio_bell     no
visual_bell_duration  0

# Theme — Gruvbox Dark, matching nvim / tmux / starship.
# Written by `kitten themes "Gruvbox Dark"`; re-run it to switch themes.
# BEGIN_KITTY_THEME
# Gruvbox Dark
include current-theme.conf
# END_KITTY_THEME
