# ─── Terminal ────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:usstyle"  # true color + undercurl
set -g focus-events on

# ─── Prefix ──────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# ─── Splits (inherit current path) ───────────────────────────────
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# ─── Reload ──────────────────────────────────────────────────────
unbind r
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ─── Resize (prefix + hjkl) ──────────────────────────────────────
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

# ─── Swap panes (prefix + HJKL, repeatable) ──────────────────────
bind -r H swap-pane -s '{left-of}'
bind -r J swap-pane -s '{down-of}'
bind -r K swap-pane -s '{up-of}'
bind -r L swap-pane -s '{right-of}'

# ─── Zoom + session re-anchor ────────────────────────────────────
bind -r m resize-pane -Z
bind M-c attach-session -c "#{pane_current_path}"

# ─── Mouse + vi copy mode ────────────────────────────────────────
set -g mouse on
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# ─── Misc ────────────────────────────────────────────────────────
set -sg escape-time 10   # no ESC delay in Neovim
set -g status-interval 5
set -g pane-border-lines heavy

# ─── Plugins (theme first, so plugin status content renders) ──────
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'  # dark256, light, light256
set -g @tmux-gruvbox-left-status-a '#S'
set -g @tmux-gruvbox-right-status-x '%d-%m-%Y'
set -g @tmux-gruvbox-right-status-y '%H:%M'
set -g @tmux-gruvbox-right-status-z '#h'

set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# ─── Initialize TPM (keep at the very bottom) ────────────────────
run '~/.tmux/plugins/tpm/tpm'
