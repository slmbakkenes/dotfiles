# ─── Terminal ────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:usstyle"  # true color + undercurl
set -g focus-events on
set -g set-clipboard on   # yank to the local clipboard over SSH (OSC 52)
set -gq allow-passthrough on  # kitty graphics through tmux (snacks.image in nvim)

# ─── Prefix ──────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ─── Windows + panes ─────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
bind c new-window -c "#{pane_current_path}"
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# ─── Reload ──────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ─── Resize (prefix + hjkl, repeatable) ──────────────────────────
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# ─── Swap panes (prefix + HJKL, repeatable) ──────────────────────
bind -r H swap-pane -s '{left-of}'
bind -r J swap-pane -s '{down-of}'
bind -r K swap-pane -s '{up-of}'
bind -r L swap-pane -s '{right-of}'

# ─── Navigate (C-hjkl across tmux panes and nvim splits; vim-tmux-navigator, no TPM) ───
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind C-l send-keys C-l   # prefix C-l still clears the screen

# ─── Zoom + sessions ─────────────────────────────────────────────
bind m resize-pane -Z
bind s choose-tree -Zs
bind M-c attach-session -c "#{pane_current_path}"

# ─── Zenvoices workbench (zv, see ~/.local/bin/zv) ───────────────
bind W command-prompt -p "worktree:" "run-shell '~/.local/bin/zv wt %%'"
bind A command-prompt -p "claude in worktree (new name = new worktree):" "run-shell '~/.local/bin/zv claude %%'"
bind S command-prompt -p "zv start (worktree, empty = main checkout):" "run-shell '~/.local/bin/zv start %%'"
bind X confirm-before -p "stop the app (zv stop)? (y/n)" "run-shell '~/.local/bin/zv stop'"
# Claude Code rings the bell when it waits on you (hooks in ~/.claude/settings.json):
# other windows get a ● in the status bar until visited; no beep from the current one.
set -g bell-action other
# Closing a session (zv stop inside zv-run) moves to another one instead of detaching.
set -g detach-on-destroy off

# ─── Mouse + vi copy mode ────────────────────────────────────────
set -g mouse on
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# ─── Misc ────────────────────────────────────────────────────────
set -sg escape-time 10   # no ESC delay in Neovim
set -g status-interval 5
set -g pane-border-lines heavy
set -g status-position top

# ─── Theme (Gruvbox; current-theme.conf is switched by `theme`) ───
source-file ~/.config/tmux/current-theme.conf

# ─── scriba typing trainer (prefix + Y) ──────────────────────────
bind Y display-popup -E -w 80% -h 40% "$HOME/go/bin/scriba"
