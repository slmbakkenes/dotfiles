# ─── Terminal ────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:usstyle"  # true color + undercurl
set -g focus-events on
set -g set-clipboard on   # yank to the local clipboard over SSH (OSC 52)

# ─── Prefix ──────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ─── Windows + panes ─────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
bind c new-window -c "#{pane_current_path}"
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# ─── Reload ──────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ─── Resize (prefix + hjkl, repeatable) ──────────────────────────
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# ─── Swap panes (prefix + HJKL, repeatable) ──────────────────────
bind -r H swap-pane -s '{left-of}'
bind -r J swap-pane -s '{down-of}'
bind -r K swap-pane -s '{up-of}'
bind -r L swap-pane -s '{right-of}'

# ─── Zoom + sessions ─────────────────────────────────────────────
bind m resize-pane -Z
bind s choose-tree -Zs
bind M-c attach-session -c "#{pane_current_path}"

# ─── Mouse + vi copy mode ────────────────────────────────────────
set -g mouse on
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# ─── Misc ────────────────────────────────────────────────────────
set -sg escape-time 10   # no ESC delay in Neovim
set -g status-interval 5
set -g pane-border-lines heavy
set -g status-position top

# ─── Theme (Gruvbox; current-theme.conf is switched by `theme`, dark without it) ───
if-shell "test -e ~/.config/tmux/current-theme.conf" \
  "source-file ~/.config/tmux/current-theme.conf" \
  "source-file ~/.config/tmux/gruvbox-dark.conf"
