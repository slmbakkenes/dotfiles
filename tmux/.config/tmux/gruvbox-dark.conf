# Gruvbox dark — linked as current-theme.conf by `theme`
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g status-left-length 30
set -g status-left "#[bg=#d79921,fg=#282828,bold] #S #[default] "
set -g status-right "#[fg=#a89984]%d-%m %H:%M #[bg=#504945,fg=#ebdbb2] #h "
setw -g window-status-format "#{?window_bell_flag,#[fg=#fabd2f bold] #I #W ●,#[fg=#a89984] #I #W} "
setw -g window-status-current-format "#[bg=#504945,fg=#689d6a,bold] #I #W#{?window_zoomed_flag, 󰊓,} "
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#d79921"
set -g message-style "bg=#504945,fg=#ebdbb2"
set -g mode-style "bg=#504945,fg=#d79921"
