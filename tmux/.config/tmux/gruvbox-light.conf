# Gruvbox light — linked as current-theme.conf by `theme`
set -g status-style "bg=#ebdbb2,fg=#3c3836"
set -g status-left-length 30
set -g status-left "#[bg=#b57614,fg=#fbf1c7,bold] #S #[default] "
set -g status-right "#[fg=#7c6f64]%d-%m %H:%M #[bg=#d5c4a1,fg=#3c3836] #h "
setw -g window-status-format "#{?window_bell_flag,#[fg=#b57614 bold] #I #W ●,#[fg=#7c6f64] #I #W} "
setw -g window-status-current-format "#[bg=#d5c4a1,fg=#427b58,bold] #I #W#{?window_zoomed_flag, 󰊓,} "
set -g pane-border-style "fg=#d5c4a1"
set -g pane-active-border-style "fg=#b57614"
set -g message-style "bg=#d5c4a1,fg=#3c3836"
set -g mode-style "bg=#d5c4a1,fg=#b57614"
