[tools]
"aqua:LuaLS/lua-language-server" = "latest"
node = ["lts", "latest"]
"aqua:JohnnyMorganz/StyLua" = "latest"
"npm:prettier" = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:@tailwindcss/language-server" = "latest"
"npm:@angular/language-server" = "latest"
"dotnet:csharpier" = "latest"
"npm:dockerfile-language-server-nodejs" = "latest"
"npm:@sentry/cli" = "latest"
pnpm = "latest"
dotnet = "10"
uv = "latest"
"pipx:qmk" = { version = "latest", uvx_args = "--managed-python" } # installed with uv
"pipx:azure-cli" = { version = "latest", uvx_args = "--managed-python" } # installed with uv
"npm:@mermaid-js/mermaid-cli" = { version = "latest", trust_policy_excludes = ["chromium-bidi@157.0.8090-0"] }

[settings]
idiomatic_version_file_enable_tools = ["node"]
